<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pramaan: evidence-backed brand governance</title>
    <meta name="description" content="Pramaan: Evidence-backed brand governance workbench that verifies marketing copy against approved brand guidelines and factual registers before publication." />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14110F" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pramaan: evidence-backed brand governance" />
    <meta property="og:description" content="Evidence-backed brand governance workbench that verifies marketing copy against approved brand guidelines and factual registers before publication." />
    <meta property="og:image" content="/og-preview.png" />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pramaan: evidence-backed brand governance" />
    <meta name="twitter:description" content="Evidence-backed brand governance workbench that verifies marketing copy against approved brand guidelines and factual registers before publication." />
    <meta name="twitter:image" content="/og-preview.png" />

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Zero-flash early theme execution script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('pramaan_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-accent-soft selection:text-accent min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
